[package]
name = "aw-cli"
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
description = "azurewrath CLI and systemctl shim"

[[bin]]
name = "azurewrath"
path = "src/main.rs"

[[bin]]
name = "systemctl"
path = "src/systemctl.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
nix = "0.29"
libc = "0.2"
