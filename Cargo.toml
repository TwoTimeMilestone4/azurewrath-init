[workspace]
resolver = "2"
members = [
    "crates/aw-pid1",
    "crates/aw-spoofd",
    "crates/aw-userd",
    "crates/aw-cli",
]

[workspace.package]
authors = ["TwoTimeMilestone4"]
repository = "https://github.com/TwoTimeMilestone4/azurewrath-init"
license = "Apache-2.0"
edition = "2021"
version = "0.1.0"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
strip = true
